# Render Blueprint — deploy the ClosePilot API on Render's free tier.
# How to use:
#   1. Push this repo to GitHub.
#   2. In Render: New +  > Blueprint  and select the repo.
#   3. After the service is created, open it and set the `sync: false` vars:
#        GROQ_API_KEY  -> your Groq key (optional; AI degrades to HUMAN_REVIEW)
#        CORS_ORIGINS  -> the URL of the deployed frontend, e.g.
#                         https://closepilot.vercel.app
#   4. Frontend lives on Vercel (root directory: apps/web, env
#      NEXT_PUBLIC_API_URL = this service's URL, e.g. https://closepilot-api.onrender.com).
#
# No database is required: the API uses an in-memory store populated with
# synthetic data. Data resets whenever the service restarts.
services:
  - type: web
    name: closepilot-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TEMPERATURE
        value: "0"
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "8000"